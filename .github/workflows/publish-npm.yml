name: Publish npm

# Publishes @aimarket/argus to npmjs.com.
# One-time: add repository secret NPM_TOKEN (granular publish token for @aimarket),
# or configure npm Trusted Publishing (OIDC) for alexar76/argus + this workflow.
#
# Manual: Actions → Publish npm → Run workflow
# Tag:    git tag v0.2.0 && git push origin v0.2.0  (after mirror tag lands on satellite)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error

  # The publish token reaches only this job, which installs nothing: whatever `npm ci`
  # pulled in above ran without it and cannot touch what is uploaded here.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: npm-tarball
          path: dist-npm

      - name: Publish to npm
        run: npm publish dist-npm/*.tgz --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
